name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Build & push BACKEND image
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY_URI_BACKEND }}:latest ./backend
          docker push ${{ secrets.ECR_REPOSITORY_URI_BACKEND }}:latest

      # Build & push FRONTEND image
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY_URI_FRONTEND }}:latest ./frontend
          docker push ${{ secrets.ECR_REPOSITORY_URI_FRONTEND }}:latest

      # SSH into EC2 and deploy both containers
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Authenticate Docker with ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI_BACKEND }}

            # Deploy backend
            docker pull ${{ secrets.ECR_REPOSITORY_URI_BACKEND }}:latest
            docker stop backend || true
            docker rm backend || true
            docker run -d \
              --name backend \
              -p 3000:3000 \
              --env-file /home/ubuntu/.env.backend \
              ${{ secrets.ECR_REPOSITORY_URI_BACKEND }}:latest

            # Deploy frontend
            docker pull ${{ secrets.ECR_REPOSITORY_URI_FRONTEND }}:latest
            docker stop frontend || true
            docker rm frontend || true
            docker run -d \
              --name frontend \
              -p 80:80 \
              ${{ secrets.ECR_REPOSITORY_URI_FRONTEND }}:latest