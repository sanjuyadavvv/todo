

services:
  backend:
    build: ./backend2
    ports:
      - "5000:3000"
    env_file:
      - ./backend2/.env
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge